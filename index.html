<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eid Ka Chand Mubarak</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(to bottom, #000428, #004e92);
            color: white;
            margin: 0;
            padding: 0;
        }
        .moon {
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, #fff 30%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            box-shadow: 0 0 15px white;
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: glow 2s infinite alternate;
        }
        @keyframes glow {
            from { box-shadow: 0 0 15px white; }
            to { box-shadow: 0 0 30px white; }
        }
        .wishes {
            font-size: 2em;
            margin-top: 250px;
            animation: fadeIn 3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="moon"></div>
    <h1 class="wishes">Eid Ka Chand Mubarak!</h1>
    <script>
        setTimeout(() => {
            document.querySelector('.wishes').innerHTML = "May this Eid bring joy and blessings!";
        }, 5000);
    </script>
</body>
</html>
